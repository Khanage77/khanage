<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6db33f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a20" media="(prefers-color-scheme: dark)">
<meta name="description" content="YouFit Workout Tracker — log every set of every workout. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>YouFit Workout Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: phone-first single column. Editor for one workout on top, history of past workouts below.
   Palette comes from the YouFit logo: slate ink (--ink) and leaf green (--brand). --accent is a darker
   green so white text on buttons stays readable; in dark mode the brand green itself is the accent. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f5f7f3; --fg:#232b33; --muted:#5f6a73; --line:#d6dcd4;
  --brand:#6db33f; --brand-2:#9ad657; --ink:#2b3440; --tint:#dcefcb; --shadow:rgba(43,52,64,.10); --glow:rgba(79,154,43,.35);
  --accent:#4f9a2b; --accent-fg:#ffffff; --accent-soft:#e4f2d8; --danger:#b83232; --ok:#3f8f2a;
  --display:'Nunito','Segoe UI',Arial,sans-serif;
  --body:'Nunito','Segoe UI','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a20; --surface:#1c232b; --surface-2:#222b34; --fg:#e8edf1; --muted:#97a3ad; --line:#2e3842;
  --brand:#8bd05a; --brand-2:#b5ea7a; --ink:#e8edf1; --tint:#1e3318; --shadow:rgba(0,0,0,.35); --glow:rgba(139,208,90,.35);
  --accent:#8bd05a; --accent-fg:#0f1f08; --accent-soft:#22361a; --danger:#f07878; --ok:#7bd26b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141a20; --surface:#1c232b; --surface-2:#222b34; --fg:#e8edf1; --muted:#97a3ad; --line:#2e3842;
  --brand:#8bd05a; --brand-2:#b5ea7a; --ink:#e8edf1; --tint:#1e3318; --shadow:rgba(0,0,0,.35); --glow:rgba(139,208,90,.35);
  --accent:#8bd05a; --accent-fg:#0f1f08; --accent-soft:#22361a; --danger:#f07878; --ok:#7bd26b; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
/* A soft green glow fades down from the top of the page */
body{margin:0;background:var(--bg) radial-gradient(130% 42% at 50% -8%,var(--tint) 0%,transparent 100%) no-repeat;color:var(--fg);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 8px;min-width:0;width:100%;font-variant-numeric:tabular-nums}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft);outline:0}
input[type=number]{-moz-appearance:textfield;text-align:center}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
@supports not (background:color-mix(in srgb,red,blue)){ header.top{background:var(--bg)} }
h1{margin:0;display:flex;flex-direction:column;gap:4px}
h1 .logo{display:block;height:42px;width:auto;max-width:100%}
h1 small{display:block;font:700 11px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-left:2px}
.tools{display:flex;gap:8px;align-items:center}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:999px}
.unit{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:13px;font-weight:600}
.unit button{padding:6px 12px;color:var(--muted)}
.unit button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.unit,.seg{background:var(--surface)}

/* Cards float on a soft shadow, with a green ribbon across the top of the workout editor */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 4px 18px var(--shadow)}
#editor{border-top:0;background:var(--surface) linear-gradient(90deg,var(--brand),var(--brand-2)) top/100% 5px no-repeat;padding-top:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head input[type=date]{width:auto;padding:6px 8px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-color:transparent}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 30px 64px 72px 32px;gap:6px 6px;align-items:center;margin-top:12px}
.cols .h{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.cols .h.num{text-align:center}
.ex{display:contents}
.ex .name{grid-row:span 2;align-self:stretch;display:flex;flex-direction:column;gap:4px;min-width:0}
.ex .name input{flex:1;padding:8px}
.ex .last{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ex .set{font:800 13px/1 var(--display);color:var(--accent);background:var(--accent-soft);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;justify-self:center}
.ex .rm{grid-row:span 2;align-self:stretch;color:var(--muted);font-size:20px;line-height:1;border-radius:6px}
.ex .rm:hover{color:var(--danger);background:var(--surface-2)}
.ex .divider{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.ex .setctl{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.ex .setctl button{font-size:12px;font-weight:700;color:var(--accent);padding:4px 10px;border-radius:999px;border:1px solid var(--accent-soft);background:var(--accent-soft)}
.ex .setctl button:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:13px;font-weight:600}
.seg button{padding:6px 12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:14px}
/* Phones: exercise name on its own row, sets underneath */
@media (max-width:520px){
  .cols{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 32px;gap:6px}
  .cols .h.exh{display:none}
  .ex .name{grid-column:1/-1;grid-row:auto!important;flex-direction:row;align-items:center;gap:8px;margin-top:4px}
  .ex .name input{flex:1 1 55%}
  .ex .name .last{flex:0 1 auto;max-width:45%}
  .ex .name .last:empty{display:none}
  .ex .rm{align-self:center}
}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:10px 14px;border-radius:999px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--accent));color:var(--accent-fg);border-color:transparent;box-shadow:0 4px 14px var(--glow)}
.btn.primary:active{transform:translateY(1px);box-shadow:0 2px 6px var(--glow)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.foot .vol{font-variant-numeric:tabular-nums}
.foot .vol b{color:var(--accent);font:800 22px/1 var(--display)}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--ok)}
.status.busy::before{background:var(--accent)}
.status.err::before{background:var(--danger)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}

.hist-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:28px;gap:10px}
.hist-head h2{font:800 22px/1 var(--display);text-transform:uppercase;margin:0;letter-spacing:.02em;position:relative;padding-bottom:6px}
.hist-head h2::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.hist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.hist li{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px var(--shadow)}
.hist li.active{border-color:var(--brand);border-left-width:4px}
.hist button.open{display:block;width:100%;text-align:left;padding:12px 14px}
.hist .d{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist .d b{font:800 18px/1 var(--display)}
.hist .d span{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .lines{margin-top:8px;display:grid;gap:3px;font-size:14px}
.hist .lines div{display:flex;justify-content:space-between;gap:10px}
.hist .lines div span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Personal records: the set that beat every earlier workout for that exercise */
input.pr{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800}
.hist .lines b.pr{color:var(--accent);margin-left:2px}
.toast.pr{background:linear-gradient(135deg,var(--brand),var(--accent));color:var(--accent-fg);font-weight:700;padding:12px 16px;text-align:center;box-shadow:0 8px 28px var(--glow)}
.empty{color:var(--muted);font-size:14px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px;margin-top:10px}
.toast{border-radius:12px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.data{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.data .eyebrow{width:100%}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.toast.upd{display:flex;align-items:center;gap:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));white-space:nowrap}
.toast.upd button{color:var(--bg);font-weight:600;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.14)}
.toast.upd #upd-go{background:var(--accent);color:var(--accent-fg)}
@media (prefers-reduced-motion:no-preference){ .hist li,.btn{transition:border-color .15s,background .15s} }
</style>

<div class="wrap">
  <header class="top">
    <h1><svg class="logo" viewBox="0 0 250 100" preserveAspectRatio="xMinYMid meet" role="img" aria-label="YouFit"><title>YouFit</title>
      <!-- Logo: the Y is a lifter holding a barbell overhead, with a green arc behind -->
      <path d="M13.6 73 A42 42 0 0 1 82.2 25" fill="none" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 29 H82" stroke-width="3.5"/>
        <path d="M35 33 L52 58 L69 33" stroke-width="8"/>
        <path d="M52 58 V88" stroke-width="9"/>
      </g>
      <circle cx="52" cy="46" r="6" fill="var(--ink)"/>
      <g fill="var(--ink)"><rect x="22" y="23" width="3.5" height="12" rx="1.2"/><rect x="26.5" y="20.5" width="4.5" height="17" rx="1.4"/><rect x="73" y="20.5" width="4.5" height="17" rx="1.4"/><rect x="78.5" y="23" width="3.5" height="12" rx="1.2"/></g>
      <text x="59" y="88" font-family="Nunito,'Segoe UI',Arial,sans-serif" font-weight="800" font-size="62" letter-spacing="-1"><tspan fill="var(--ink)">ou</tspan><tspan fill="var(--brand)">Fit</tspan></text>
    </svg><small>workout tracker</small></h1>
    <div class="tools"><button type="button" class="btn primary sm" id="install" hidden>Install</button>
    <div class="unit" role="group" aria-label="Weight unit">
      <button type="button" id="unit-kg" aria-pressed="true">kg</button>
      <button type="button" id="unit-lb" aria-pressed="false">lb</button>
    </div></div>
  </header>

  <section class="card" id="editor" aria-live="polite">
    <div class="empty">Connecting…</div>
  </section>

  <div class="hist-head">
    <h2>History</h2>
    <span class="eyebrow" id="hist-count"></span>
  </div>
  <ul class="hist" id="hist"></ul>

  <div class="data">
    <span class="eyebrow">Settings</span>
    <div class="setting"><span>Sets per exercise <span class="note" style="margin:0">(new exercises start with this many)</span></span>
      <div class="seg" role="group" aria-label="Default sets per exercise" id="sets-seg">
        <button type="button" data-sets="2">2</button><button type="button" data-sets="3">3</button><button type="button" data-sets="4">4</button><button type="button" data-sets="5">5</button>
      </div></div>
  </div>
  <div class="data">
    <span class="eyebrow">Your data</span>
    <button type="button" class="btn" id="export-csv">Export CSV</button>
    <button type="button" class="btn" id="backup">Backup</button>
    <button type="button" class="btn" id="restore">Restore</button>
    <input type="file" id="restore-file" accept="application/json,.json" hidden>
  </div>
  <p class="note">Each phone keeps its own workouts; nothing is shared or uploaded. Take a backup before changing phones or clearing browser data.</p>
  <datalist id="exnames"></datalist>
</div>

<script>
(function(){
  // Storage keys keep their original names on purpose: renaming them would hide every workout already logged on a phone.
  const LS_KEY='twosets.v1', UNIT_KEY='twosets.unit', SETS_KEY='twosets.sets', MAX_SETS=8;
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let unit='kg'; try{ unit=localStorage.getItem(UNIT_KEY)||'kg' }catch(e){}
  let defaultSets=2; try{ defaultSets=Math.min(MAX_SETS,Math.max(1,parseInt(localStorage.getItem(SETS_KEY),10)||2)) }catch(e){}
  let store=null, sessions={}, currentId=null, dirty={}, saving={}, timers={}, chains={}, confirmDelete=false, booted=false;
  let status={kind:'ok',text:''};

  /* Snapshots from the synced store are frozen: always work on an editable copy. */
  const clone=o=>JSON.parse(JSON.stringify(o));
  const canon=s=>JSON.stringify([s.date||'',s.unit||'',(s.exercises||[]).map(e=>[e.name||'',(e.sets||[]).map(x=>[x.reps??null,x.weight??null])])]);
  /* Every workout remembers the unit it was logged in, so switching kg/lb never relabels old data. */
  const sessUnit=s=>(s&&s.unit)||unit;
  const convertW=(w,from,to)=>{ if(w==null||from===to) return w; const v=from==='kg'?w*2.20462:w/2.20462; return Math.round(v*2)/2 };
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const blankSet=()=>({reps:null,weight:null});
  const blankEx=()=>({name:'',sets:Array.from({length:defaultSets},blankSet)});
  const blankSession=()=>({date:today(),unit,exercises:[blankEx()],createdAt:Date.now()});
  /* Repeat: same exercises and set counts as the last logged workout, values left empty */
  const repeatSession=src=>({date:today(),unit,createdAt:Date.now(),exercises:(src.exercises||[]).filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:Array.from({length:Math.max(1,e.sets.length)},blankSet)}))});
  const fmtDate=iso=>{const [y,m,d]=(iso||'').split('-').map(Number);if(!y)return iso||'';return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
  const fmtSet=s=>(s.reps??'–')+'×'+(s.weight??'–');
  const volume=sess=>(sess.exercises||[]).reduce((t,e)=>t+e.sets.reduce((u,s)=>u+((+s.reps||0)*(+s.weight||0)),0),0);
  const sortedIds=()=>Object.keys(sessions).sort((a,b)=>(sessions[b].date||'').localeCompare(sessions[a].date||'')||(sessions[b].createdAt||0)-(sessions[a].createdAt||0));
  const hasContent=sess=>(sess.exercises||[]).some(e=>e.name.trim()||e.sets.some(s=>s.reps!=null||s.weight!=null));
  const lastSession=excludeId=>{ for(const id of sortedIds()){ if(id!==excludeId&&hasContent(sessions[id])) return sessions[id] } return null };

  /* ---------- personal records ---------- */
  const toKg=(w,u)=>u==='lb'?w/2.20462:w;
  const earlier=(a,b)=>((a.date||'')<(b.date||''))||((a.date||'')===(b.date||'')&&(a.createdAt||0)<(b.createdAt||0));
  // Best weight (and best reps for bodyweight sets) for an exercise across the workouts before this one
  function bestBefore(name,sess){
    const n=name.trim().toLowerCase(); let bestW=null,bestR=null; if(!n) return {bestW,bestR};
    for(const id in sessions){ const s=sessions[id]; if(s===sess||!earlier(s,sess)) continue;
      for(const e of s.exercises||[]){ if(e.name.trim().toLowerCase()!==n) continue;
        for(const x of e.sets){ if(x.weight!=null&&x.weight>0){ const kg=toKg(x.weight,sessUnit(s)); if(bestW==null||kg>bestW) bestW=kg } else if(x.reps!=null&&x.reps>0&&(bestR==null||x.reps>bestR)) bestR=x.reps } } }
    return {bestW,bestR};
  }
  // A set is a PR when it beats every earlier workout for that exercise. The first time you ever log a lift is not a PR.
  function isPR(sess,e,x,b){ b=b||bestBefore(e.name,sess);
    if(x.weight!=null&&x.weight>0) return b.bestW!=null&&toKg(x.weight,sessUnit(sess))>b.bestW+1e-6;
    if(x.reps!=null&&x.reps>0&&x.weight==null) return b.bestR!=null&&x.reps>b.bestR;
    return false }
  const celebrated=new Set(); // one cheer per set while the page is open
  function cheerPR(sess,i,k){ const e=sess.exercises[i], x=e.sets[k]; if(!isPR(sess,e,x)) return false;
    const key=currentId+':'+i+':'+k; if(!celebrated.has(key)){ celebrated.add(key);
      toast('🏆 New PR! Well done, you’re getting stronger — '+e.name.trim()+' '+(x.weight!=null?x.weight+' '+sessUnit(sess):x.reps+' reps'),4500,'pr');
      if(navigator.vibrate) navigator.vibrate([40,60,40]); }
    return true }

  /* ---------- storage backends ---------- */
  function localStore(){
    let data=localData();
    const persist=()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(data)) }catch(e){ throw new Error('This browser is not allowing storage.') } };
    // Workouts saved before units were stored were shown in the unit chosen at the time; keep them that way.
    let fixed=false; for(const k in data){ if(data[k]&&!data[k].unit){ data[k].unit=unit; fixed=true } } if(fixed){ try{ persist() }catch(e){} }
    return { kind:'local', label:'on this device',
      subscribe(cb){ cb(data); return ()=>{} },
      async save(id,d){ data[id]=d; persist() },
      async remove(id){ delete data[id]; persist() },
      replaceAll(d){ data=d; persist(); return data } };
  }
  function localData(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{} }catch(e){ return {} } }

  /* ---------- saving ---------- */
  function setStatus(kind,text){ status={kind,text}; const el=$('#status'); if(el){el.className='status '+kind; el.textContent=text} }
  function scheduleSave(id){
    dirty[id]=true; clearTimeout(timers[id]);
    setStatus('busy','Saving…');
    timers[id]=setTimeout(()=>flush(id),700);
  }
  function flush(id){
    const sess=sessions[id]; if(!sess) return;
    dirty[id]=false; saving[id]=(saving[id]||0)+1;
    const body=clone(sess);
    chains[id]=(chains[id]||Promise.resolve()).then(()=>store.save(id,body)).then(()=>{
      if(!dirty[id]) setStatus('ok','Saved · '+store.label);
    }).catch(e=>{
      const msg=e&&e.code==='quota_exceeded'?'Storage is full. Delete old workouts to keep saving.':(e&&e.message)||'Could not save';
      setStatus('err',msg);
    }).then(()=>{ saving[id]=Math.max(0,(saving[id]||1)-1) });
  }

  /* ---------- rendering ---------- */
  function lastFor(name,excludeId){
    const n=name.trim().toLowerCase(); if(!n) return null;
    for(const id of sortedIds()){ if(id===excludeId) continue;
      const e=(sessions[id].exercises||[]).find(x=>x.name.trim().toLowerCase()===n);
      if(e&&e.sets.some(s=>s.reps!=null||s.weight!=null)) return {date:sessions[id].date,unit:sessUnit(sessions[id]),sets:e.sets};
    }
    return null;
  }
  const lastText=(last,su)=>last?'Last: '+last.sets.map(fmtSet).join(' · ')+(last.unit!==su?' '+last.unit:''):'';
  /* Previous values show as placeholders so a repeated workout reads like last time's sheet */
  const phReps=(last,k)=>last&&last.sets[k]&&last.sets[k].reps!=null?String(last.sets[k].reps):'reps';
  const phWeight=(last,k,su)=>{ const w=last&&last.sets[k]?last.sets[k].weight:null; return w==null?su:String(convertW(w,last.unit,su)) };
  function renderNames(){
    const seen=new Set(), out=[];
    for(const id of sortedIds()) for(const e of sessions[id].exercises||[]){const n=e.name.trim();if(n&&!seen.has(n.toLowerCase())){seen.add(n.toLowerCase());out.push(n)}}
    $('#exnames').innerHTML=out.map(n=>'<option value="'+esc(n)+'">').join('');
  }
  function renderEditor(){
    const sess=sessions[currentId]; const el=$('#editor');
    if(!sess){ el.innerHTML='<div class="empty">No workout open.</div>'; return }
    const su=sessUnit(sess); syncUnitToggle(su);
    const rows=sess.exercises.map((e,i)=>{
      const last=lastFor(e.name,currentId);
      const lastTxt=lastText(last,su);
      const n=e.sets.length, best=bestBefore(e.name,sess);
      return '<div class="ex" data-i="'+i+'">'
        +'<div class="name" style="grid-row:span '+n+'"><input type="text" id="ex-'+i+'-name" list="exnames" placeholder="Exercise" autocomplete="off" value="'+esc(e.name)+'" data-f="name"><div class="last" title="'+esc(lastTxt)+'">'+esc(lastTxt)+'</div></div>'
        +e.sets.map((s,k)=>{ const pr=isPR(sess,e,s,best)?' class="pr" title="Personal record"':''; return '<div class="set">'+(k+1)+'</div>'
          +'<input type="number" inputmode="numeric" min="0" step="1" id="ex-'+i+'-r'+k+'" placeholder="'+esc(phReps(last,k))+'" value="'+(s.reps??'')+'" data-f="reps" data-k="'+k+'"'+pr+'>'
          +'<input type="number" inputmode="decimal" min="0" step="any" id="ex-'+i+'-w'+k+'" placeholder="'+esc(phWeight(last,k,su))+'" value="'+(s.weight??'')+'" data-f="weight" data-k="'+k+'"'+pr+'>'
          +(k===0?'<button type="button" class="rm" style="grid-row:span '+n+'" data-rm="'+i+'" aria-label="Remove exercise" title="Remove exercise">×</button>':'')
        }).join('')
        +'<div class="setctl">'+(n>1?'<button type="button" data-delset="'+i+'" aria-label="Remove last set">– set</button>':'')+(n<MAX_SETS?'<button type="button" data-addset="'+i+'" aria-label="Add a set">+ set</button>':'')+'</div>'
        +(i<sess.exercises.length-1?'<div class="divider"></div>':'')
        +'</div>';
    }).join('');
    el.innerHTML=
      '<div class="card-head"><span class="eyebrow">Workout</span><input type="date" id="sess-date" value="'+esc(sess.date)+'" aria-label="Workout date"></div>'
      +'<div class="cols"><div class="h exh">Exercise</div><div class="h num">Set</div><div class="h num">Reps</div><div class="h num">Weight ('+su+')</div><div></div>'+rows+'</div>'
      +'<div class="actions"><button type="button" class="btn primary" id="add-ex">+ Add exercise</button>'
      +(lastSession(currentId)?'<button type="button" class="btn" id="repeat-sess" title="Start a new workout with the same exercises as last time">Repeat last</button>':'')
      +'<button type="button" class="btn" id="new-sess">New workout</button><button type="button" class="btn danger" id="del-sess">Delete</button></div>'
      +(confirmDelete?'<div class="confirm" id="confirm">Delete this workout for good?<button type="button" class="btn danger" id="del-yes">Delete</button><button type="button" class="btn" id="del-no">Keep</button></div>':'')
      +'<div class="foot"><span class="vol">Volume <b id="vol">'+volume(sess).toLocaleString()+'</b> '+su+'</span><span class="status '+status.kind+'" id="status">'+esc(status.text)+'</span></div>';
  }
  function renderHistory(){
    const ids=sortedIds().filter(id=>hasContent(sessions[id])||id===currentId);
    $('#hist-count').textContent=ids.length?ids.length+(ids.length===1?' workout':' workouts'):'';
    if(!ids.length){ $('#hist').innerHTML='<li class="empty" style="border:0;background:none">Your first workout will appear here once you log a set.</li>'; return }
    $('#hist').innerHTML=ids.map(id=>{const s=sessions[id];const ex=(s.exercises||[]).filter(e=>e.name.trim());
      return '<li class="'+(id===currentId?'active':'')+'"><button type="button" class="open" data-open="'+id+'">'
        +'<div class="d"><b>'+esc(fmtDate(s.date))+'</b><span>'+ex.length+' ex · '+volume(s).toLocaleString()+' '+sessUnit(s)+'</span></div>'
        +(ex.length?'<div class="lines">'+ex.map(e=>{ const best=bestBefore(e.name,s); return '<div><span>'+esc(e.name)+'</span><span>'+e.sets.map(x=>fmtSet(x)+(isPR(s,e,x,best)?'<b class="pr" title="Personal record">★</b>':'')).join(' · ')+'</span></div>' }).join('')+'</div>':'<div class="lines"><div><span style="color:var(--muted)">Empty workout</span></div></div>')
        +'</button></li>'}).join('');
  }
  function renderAll(){ renderNames(); renderEditor(); renderHistory(); }

  /* ---------- events ---------- */
  $('#editor').addEventListener('input',ev=>{
    const t=ev.target, sess=sessions[currentId]; if(!sess) return;
    if(t.id==='sess-date'){ if(t.value){sess.date=t.value; scheduleSave(currentId); renderHistory()} return }
    const ex=t.closest('.ex'); if(!ex) return;
    const e=sess.exercises[+ex.dataset.i]; if(!e) return;
    if(t.dataset.f==='name'){ e.name=t.value; const last=lastFor(e.name,currentId), su=sessUnit(sess); ex.querySelector('.last').textContent=lastText(last,su);
      const best=bestBefore(e.name,sess);
      e.sets.forEach((s,k)=>{ const r=ex.querySelector('[data-f=reps][data-k="'+k+'"]'), w=ex.querySelector('[data-f=weight][data-k="'+k+'"]'); if(r) r.placeholder=phReps(last,k); if(w) w.placeholder=phWeight(last,k,su);
        const pr=isPR(sess,e,s,best); [r,w].forEach(n=>{ if(n){ n.classList.toggle('pr',pr); n.title=pr?'Personal record':'' } }); }); }
    else { const v=t.value===''?null:+t.value; const k=+t.dataset.k; e.sets[k][t.dataset.f]=isNaN(v)?null:v; $('#vol').textContent=volume(sess).toLocaleString();
      const pr=cheerPR(sess,+ex.dataset.i,k); ex.querySelectorAll('[data-k="'+k+'"]').forEach(n=>{ n.classList.toggle('pr',pr); n.title=pr?'Personal record':'' }); }
    scheduleSave(currentId); renderHistory();
  });
  $('#editor').addEventListener('click',ev=>{
    const b=ev.target.closest('button'); if(!b) return;
    const sess=sessions[currentId];
    if(b.id==='add-ex'){ sess.exercises.push(blankEx()); renderEditor(); const n=sess.exercises.length-1; const inp=document.getElementById('ex-'+n+'-name'); if(inp) inp.focus(); }
    else if(b.dataset.addset!=null){ const e=sess.exercises[+b.dataset.addset]; if(e&&e.sets.length<MAX_SETS){ e.sets.push(blankSet()); scheduleSave(currentId); renderEditor(); renderHistory(); const inp=document.getElementById('ex-'+b.dataset.addset+'-r'+(e.sets.length-1)); if(inp) inp.focus(); } }
    else if(b.dataset.delset!=null){ const e=sess.exercises[+b.dataset.delset]; if(e&&e.sets.length>1){ const last=e.sets[e.sets.length-1]; if(last.reps!=null||last.weight!=null){ toast('Clear set '+e.sets.length+' first, then remove it'); return } e.sets.pop(); scheduleSave(currentId); renderEditor(); renderHistory(); } }
    else if(b.dataset.rm!=null){ sess.exercises.splice(+b.dataset.rm,1); if(!sess.exercises.length) sess.exercises.push(blankEx()); scheduleSave(currentId); renderEditor(); renderHistory(); }
    else if(b.id==='new-sess'){ openNew(); }
    else if(b.id==='repeat-sess'){ openRepeat(); }
    else if(b.id==='del-sess'){ confirmDelete=true; renderEditor(); }
    else if(b.id==='del-no'){ confirmDelete=false; renderEditor(); }
    else if(b.id==='del-yes'){ const id=currentId; confirmDelete=false; clearTimeout(timers[id]); dirty[id]=false; delete sessions[id];
      (chains[id]||Promise.resolve()).then(()=>store.remove(id)).catch(e=>setStatus('err',(e&&e.message)||'Could not delete'));
      currentId=sortedIds()[0]||null; if(!currentId) openNew(); else renderAll(); }
  });
  $('#hist').addEventListener('click',ev=>{
    const b=ev.target.closest('[data-open]'); if(!b||!sessions[b.dataset.open]) return;
    if(currentId&&!hasContent(sessions[currentId])&&currentId!==b.dataset.open) delete sessions[currentId];
    currentId=b.dataset.open; confirmDelete=false; renderAll(); window.scrollTo({top:0,behavior:'smooth'});
  });
  function openNew(){
    if(currentId&&sessions[currentId]&&!hasContent(sessions[currentId])) delete sessions[currentId];
    currentId=uid(); sessions[currentId]=blankSession(); confirmDelete=false; renderAll();
    const inp=document.getElementById('ex-0-name'); if(inp) inp.focus();
  }
  function openRepeat(){
    const src=lastSession(currentId); if(!src){ openNew(); return }
    if(currentId&&sessions[currentId]&&!hasContent(sessions[currentId])) delete sessions[currentId];
    currentId=uid(); sessions[currentId]=repeatSession(src); confirmDelete=false; scheduleSave(currentId); renderAll();
    const inp=document.getElementById('ex-0-r0'); if(inp) inp.focus();
    toast('Same exercises as '+fmtDate(src.date)+' — fill in today\'s sets');
  }
  /* The kg/lb toggle shows the open workout's unit. Tapping it converts that workout and becomes the default for new ones. */
  function syncUnitToggle(u){ $('#unit-kg').setAttribute('aria-pressed',u==='kg'); $('#unit-lb').setAttribute('aria-pressed',u==='lb'); }
  function setUnit(u){
    unit=u; try{localStorage.setItem(UNIT_KEY,u)}catch(e){}
    const sess=sessions[currentId];
    if(sess&&sessUnit(sess)!==u){
      const from=sessUnit(sess); let n=0;
      sess.exercises.forEach(e=>e.sets.forEach(s=>{ if(s.weight!=null){ s.weight=convertW(s.weight,from,u); n++ } }));
      sess.unit=u; scheduleSave(currentId);
      if(n) toast('Converted this workout to '+u);
    }
    syncUnitToggle(u); if(store) renderAll();
  }
  $('#unit-kg').onclick=()=>setUnit('kg'); $('#unit-lb').onclick=()=>setUnit('lb');
  syncUnitToggle(unit);
  function setDefaultSets(n){ defaultSets=n; try{localStorage.setItem(SETS_KEY,String(n))}catch(e){}
    document.querySelectorAll('#sets-seg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.sets===n));
    // An untouched exercise in the open workout follows the new default
    const sess=sessions[currentId]; if(sess){ let changed=false; sess.exercises.forEach(e=>{ if(!e.name.trim()&&e.sets.every(x=>x.reps==null&&x.weight==null)&&e.sets.length!==n){ e.sets=Array.from({length:n},blankSet); changed=true } }); if(changed) renderEditor(); }
  }
  $('#sets-seg').addEventListener('click',ev=>{ const b=ev.target.closest('[data-sets]'); if(b) setDefaultSets(+b.dataset.sets); });
  setDefaultSets(defaultSets);

  /* ---------- boot ---------- */
  function onData(remote){
    const prevId=currentId, before=currentId&&sessions[currentId]?canon(sessions[currentId]):null;
    for(const id of Object.keys(remote)){
      if(dirty[id]||saving[id]) continue;
      if(sessions[id]&&canon(sessions[id])===canon(remote[id])) continue;
      sessions[id]=clone(remote[id]);
    }
    for(const id of Object.keys(sessions)){ if(!remote[id]&&!dirty[id]&&!saving[id]&&id!==currentId&&hasContent(sessions[id])) delete sessions[id]; }
    if(!currentId||!sessions[currentId]){
      const ids=sortedIds();
      if(ids.length&&sessions[ids[0]].date===today()) currentId=ids[0]; else { currentId=uid(); sessions[currentId]=blankSession(); }
    }
    const after=sessions[currentId]?canon(sessions[currentId]):null;
    renderNames(); renderHistory();
    if(!booted||prevId!==currentId||before!==after){
      const a=document.activeElement, keep=a&&a.id&&$('#editor').contains(a)?a.id:null;
      renderEditor();
      if(keep){ const n=document.getElementById(keep); if(n) n.focus(); }
    }
    booted=true;
  }
  function start(){
    store=localStore();
    setStatus('ok','Saved on this device');
    store.subscribe(onData);
  }
  start();

  /* ---------- export / backup / restore ---------- */
  function toast(msg,ms,cls){ let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)} t.className='toast'+(cls?' '+cls:''); t.textContent=msg; clearTimeout(toast.t); toast.t=setTimeout(()=>t.remove(),ms||2600); }
  function download(name,text,type){
    const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  $('#export-csv').onclick=()=>{
    const rows=[['date','exercise','set','reps','weight','unit']];
    for(const id of sortedIds().reverse()){ const s=sessions[id]; if(!hasContent(s)) continue;
      (s.exercises||[]).forEach(e=>{ if(!e.name.trim()) return; e.sets.forEach((x,k)=>{ if(x.reps==null&&x.weight==null) return; rows.push([s.date,e.name.trim(),k+1,x.reps??'',x.weight??'',sessUnit(s)]) }) }) }
    if(rows.length===1){ toast('Nothing to export yet'); return }
    download('youfit-workouts-'+today()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
  };
  $('#backup').onclick=()=>{
    const data=localData(); const n=Object.keys(data).length;
    if(!n){ toast('Nothing to back up yet'); return }
    download('youfit-backup-'+today()+'.json',JSON.stringify({app:'youfit',version:1,exported:new Date().toISOString(),unit,workouts:data},null,1),'application/json');
    toast('Backup saved · '+n+(n===1?' workout':' workouts'));
  };
  $('#restore').onclick=()=>$('#restore-file').click();
  $('#restore-file').addEventListener('change',ev=>{
    const f=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(!f) return;
    f.text().then(txt=>{
      let j; try{ j=JSON.parse(txt) }catch(e){ toast('That file is not a YouFit backup'); return }
      const w=j&&(j.app==='youfit'||j.app==='khanage'||j.app==='two-sets')&&j.workouts&&typeof j.workouts==='object'?j.workouts:null; // older backups still restore
      if(!w){ toast('That file is not a YouFit backup'); return }
      const bu=j.unit==='lb'?'lb':'kg'; // older backups carry one unit for everything
      for(const k in w){ if(!w[k].unit) w[k].unit=bu; (w[k].exercises||[]).forEach(e=>{ if(!Array.isArray(e.sets)||!e.sets.length) e.sets=[blankSet()]; }) }
      const merged=Object.assign({},localData(),w); // keeps what is on this device, adds the backup
      store.replaceAll(merged); sessions={}; currentId=null; dirty={}; saving={}; booted=false;
      const n=Object.keys(w).length; onData(merged); toast('Restored · '+n+(n===1?' workout':' workouts'));
    });
  });

  /* ---------- install + offline ---------- */
  let installEvt=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('#install').hidden=false; });
  $('#install').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); const r=await installEvt.userChoice; if(r&&r.outcome==='accepted'){ $('#install').hidden=true; installEvt=null; } };
  window.addEventListener('appinstalled',()=>{ $('#install').hidden=true; toast('Installed — find YouFit on your home screen'); });
  /* A new version is fetched in the background; offer a reload instead of forcing one mid-workout. */
  function showUpdate(){
    if($('#upd')) return;
    const t=document.createElement('div'); t.id='upd'; t.className='toast upd';
    t.innerHTML='<span>YouFit has been updated</span><button type="button" id="upd-go">Reload</button><button type="button" id="upd-later" aria-label="Later">×</button>';
    document.body.appendChild(t);
    $('#upd-go').onclick=()=>{ Object.keys(timers).forEach(id=>{ clearTimeout(timers[id]); if(dirty[id]) flush(id) }); setTimeout(()=>location.reload(),150); };
    $('#upd-later').onclick=()=>t.remove();
  }
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('sw.js').then(reg=>{
        const watch=w=>{ if(!w) return; w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) showUpdate() }) };
        watch(reg.installing);
        reg.addEventListener('updatefound',()=>watch(reg.installing));
        // Installed apps stay open for days: look for a new version whenever the app comes back to the front
        document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}) });
      }).catch(()=>{});
    });
  }
})();
</script>
